apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ .Release.Name }}-web
spec:
  entryPoints:
    - web
  routes:
    - kind: Rule
      match: Host(`k8s.com`) && PathPrefix(`/safplatform`)
      services:
        - kind: Service
          name: {{ .Release.Name }}
          port: 80
